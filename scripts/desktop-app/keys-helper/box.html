<!doctype html>
<!--
  Yonna's box at the top left — drawn as a page inside the helper's panel, as
  Atticus draws its own. The orb is the thinking-orbs engine (MIT, Jakub
  Antalik), inlined by build.sh in place of the marker below.
  The helper calls ui.set({state, question, answer}) and ui.level(0..1); the
  page reports its height back so the panel fits it.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --ease: cubic-bezier(.2, .8, .2, 1); }
  html, body { margin: 0; background: transparent; overflow: hidden;
    font: 14px/1.42 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; color: #f2f2f2; cursor: default; user-select: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  #card { margin: 0; padding: 12px 14px 13px; border-radius: 18px;
    /* See-through, so the Mac glass behind it (the helper's blur) shows. */
    background: linear-gradient(180deg, rgba(40,40,44,.10), rgba(20,20,22,.16));
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.06);
    animation: in .32s var(--ease) both; }
  @keyframes in { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
  #head { display: flex; align-items: center; gap: 10px; min-height: 28px; }
  #orb { width: 28px; height: 28px; flex: none; transition: transform .12s ease-out; }
  #status { font-size: 12px; font-weight: 500; letter-spacing: .01em; color: rgba(255,255,255,.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #wave { display: none; align-items: center; gap: 3px; height: 18px; margin-left: auto; }
  body.listening #wave { display: flex; }
  #wave i { width: 3px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.75);
    transition: height .09s ease-out; }
  #q { margin: 9px 0 0; font-size: 13px; color: rgba(255,255,255,.58); }
  #q:empty, #a:empty { display: none; }
  #a { margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: #fff; white-space: pre-wrap; }
  #q, #a { animation: fade .25s var(--ease) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } }
  body.notice #a { font-size: 13.5px; color: rgba(255,255,255,.85); }
  /* Voice on / off. The click itself is taken by a native view the helper lays over it. */
  #voice { flex: none; width: 26px; height: 26px; margin-left: 8px; border-radius: 8px;
    display: grid; place-items: center; color: rgba(255,255,255,.7);
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12); }
  #voice svg { width: 15px; height: 15px; }
  #voice .x { display: none; }
  body.mute-voice #voice { color: rgba(255,255,255,.4); }
  body.mute-voice #voice .x { display: inline; }
  body.mute-voice #voice .w { display: none; }
  #wave { margin-left: auto; }
</style>
</head>
<body>
<div id="card">
  <div id="head"><canvas id="orb"></canvas><div id="status"></div><div id="wave"></div><div id="voice" title="Voice on/off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="m16 9 6 6m0-6-6 6"/></svg></div></div>
  <div id="q"></div>
  <div id="a"></div>
</div>
<script type="text/plain" id="orbsrc">/*ORBS*/</script>
<script type="module">
  // thinking-orbs engine chunk: M = MODE_FRAMES, p = paintFrame, r = resolvePreset
  const E = await import(URL.createObjectURL(new Blob([document.getElementById('orbsrc').textContent], { type: 'text/javascript' })));
  const $ = (id) => document.getElementById(id);
  const cv = $('orb'), ctx = cv.getContext('2d'), S = 64, dpr = 2;
  cv.width = cv.height = S * dpr;
  for (let i = 0; i < 9; i++) $('wave').append(document.createElement('i'));

  const ORB = { listening: 'listening', thinking: 'solving', answer: 'breathing', notice: 'breathing' };
  const STATUS = { listening: 'Listening', thinking: 'Thinking', answer: 'Yonna', notice: 'Yonna' };
  let state = '', voiceOn = true, preset = E.r('breathing', S), boost = 1, t = 0, prev = performance.now();
  (function frame(now) {
    t += Math.min(0.05, (now - prev) / 1000) * preset.speed * boost;
    prev = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, S, S);
    E.p(ctx, E.M[preset.mode](S, t, preset.opts), true, null);
    requestAnimationFrame(frame);
  })(prev);

  const fit = () => webkit.messageHandlers.h.postMessage(Math.ceil($('card').getBoundingClientRect().height));
  new ResizeObserver(fit).observe($('card'));

  const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; };
  window.ui = {
    set({ state: s, question = null, answer = null }) {
      if (s && s !== state) {
        state = s;
        document.body.className = s + (voiceOn ? '' : ' mute-voice');
        preset = E.r(ORB[s] || 'breathing', S);
        boost = 1;
        $('orb').style.transform = '';
      }
      setText($('status'), STATUS[state] ?? '');
      if (question !== null) setText($('q'), question);
      if (answer !== null) setText($('a'), answer);
      fit();
    },
    /** Spoken answers on or off — only the button's look; the helper does the rest. */
    voice(on) {
      voiceOn = on;
      document.body.classList.toggle('mute-voice', !on);
    },
    /** The microphone's loudness while listening: the wave and the orb follow it. */
    level(v) {
      if (state !== 'listening') return;
      boost = 0.6 + v * 2.4;
      $('orb').style.transform = `scale(${1 + v * 0.12})`;
      const bars = $('wave').children;
      for (let i = 0; i < bars.length; i++) {
        const shape = 0.45 + 0.55 * Math.sin((i / (bars.length - 1)) * Math.PI);
        bars[i].style.height = `${4 + Math.min(1, v * (0.7 + Math.random() * 0.6)) * 14 * shape}px`;
      }
    },
  };
  fit();
</script>
</body>
</html>
